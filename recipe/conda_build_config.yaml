# jaxlib wants clang on all platforms
c_compiler:
- clang
cxx_compiler:
- clangxx
# On linux the pinning zips {c,cxx,fortran}_compiler_version with
# c_stdlib_version and cuda_compiler_version, so overriding the compiler
# versions requires fully implementing that zip. We provide the CPU and
# CUDA 12.9 rows here and let the CUDA migration append the CUDA 13 row.
c_compiler_version:
- '22'
- '22'                  # [linux]
cxx_compiler_version:
- '22'
- '22'                  # [linux]
fortran_compiler_version:
- '15'
- '14'                  # [linux]
c_stdlib_version:       # [linux]
- '2.17'                # [linux]
- '2.17'                # [linux]
cuda_compiler_version:
- None
- '12.9'                # [linux]

github_actions_labels:
- namespace-profile-16cpu-on-linux-64       # [linux64]
- namespace-profile-8cpu-on-linux-aarch64   # [linux and aarch64]
- namespace-profile-12cpu-on-osx-arm64      # [osx]
